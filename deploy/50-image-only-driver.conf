[Service]
# ============================================================
# 魔改 #13：图片模型 driver 放行（生产环境开关）
#
# 背景：虎云/ZZ 的生图账号上游只卖图片模型（/v1/models 里没有任何文本模型）。
# 官方 OpenAI /v1/responses 要求 driver 必须是文本模型，于是
# normalizeOpenAIResponsesImageOnlyModel 会把 driver 改写成
# SUB2API_IMAGES_MAIN_MODEL(=gpt-5.6-sol)，上游直接 503 model_not_found，
# failover 烧满 10 次切换 -> 用户看到 502 / 生图极慢。
#
# 打开本开关后：driver 保持客户端请求的图片模型本身（实测虎云 200，17-23s），
# validateOpenAIResponsesImageModel 也不再对 image-only driver 报 400。
#
# ⚠️ 本文件不在 git 仓库内运行时目录，重装/迁移时必须用
#    scripts/install-deploy-assets.sh 重新安装，否则功能静默丢失。
#
# 回滚：删除本文件 + systemctl daemon-reload + systemctl restart sub2api
# ============================================================
Environment=SUB2API_ALLOW_IMAGE_ONLY_RESPONSES_DRIVER=1